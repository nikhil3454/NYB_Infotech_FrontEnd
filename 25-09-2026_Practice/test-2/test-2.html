<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
     <style>
        /* Universal selector */
        * {
            box-sizing: border-box;
        }
        /* Element selector */
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
        } 
        /* Class selector */
        .container {
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid black;
            border-radius: 10px;
        }
        /* ID selector */
        #heading {
            color: blue;
            background-color: lightblue;
            padding: 10px;
            border-radius: 5px;
        }
        /* Element selector */
        p {
            color: darkslategray;
            margin: 20px 0;
            padding: 10px;
        }
        /* Class selector */
        .btn {
            background-color: green;
            color: white;
            padding: 10px 20px;
            margin-top: 10px;
            border: 5px solid darkgreen;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="heading">Welcome to CSS</h1>

        <p>
            This webpage demonstrates CSS selectors,
            background colors, borders, padding, margins,
            rounded corners, width, and box-sizing.
        </p>

        <button class="btn">Click Me</button>
    </div>
    <script src="test-2.js"></script>
</body>
</html>
